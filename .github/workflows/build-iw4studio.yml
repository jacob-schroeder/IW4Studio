name: Build IW4Studio

on:
  push:
    branches:
      - main
    paths:
      - apps/IW4Studio/**
      - src/**
      - Resources/**
      - global.json
      - .github/workflows/build-iw4studio.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    name: Resolve IW4Studio version
    runs-on: ubuntu-latest
    outputs:
      public_version: ${{ steps.version.outputs.public_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive build version
        id: version
        shell: bash
        run: |
          version_line="$(sed -n 's:^[[:space:]]*<VersionPrefix>\([^<]*\)</VersionPrefix>[[:space:]]*$:\1:p' apps/IW4Studio/IW4.Studio.Desktop.csproj)"
          if [[ ! "$version_line" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one major.minor VersionPrefix in apps/IW4Studio/IW4.Studio.Desktop.csproj." >&2
            exit 1
          fi
          public_version="${version_line}.${GITHUB_RUN_NUMBER}"
          file_version="${public_version}.${GITHUB_RUN_ATTEMPT}"
          informational_version="${public_version}+attempt.${GITHUB_RUN_ATTEMPT}.sha.${GITHUB_SHA}"
          echo "public_version=$public_version" >> "$GITHUB_OUTPUT"
          echo "file_version=$file_version" >> "$GITHUB_OUTPUT"
          echo "informational_version=$informational_version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x64
            runner: windows-latest
            runtime: win-x64
            asset: iw4studio-win_x64.zip
          - platform: macos_arm64
            runner: macos-15
            runtime: osx-arm64
            asset: iw4studio-macos_arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish desktop app
        shell: bash
        run: >-
          dotnet publish apps/IW4Studio/IW4.Studio.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output publish
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.version.outputs.public_version }}
          -p:FileVersion=${{ needs.version.outputs.file_version }}
          -p:InformationalVersion=${{ needs.version.outputs.informational_version }}
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Remove symbol files
        shell: bash
        run: find publish -type f -iname '*.pdb' -delete

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = "artifact/release/iw4studio/${{ matrix.platform }}/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Compress-Archive -Path "publish/*" -DestinationPath $destination -CompressionLevel Optimal

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "artifact/release/iw4studio/${{ matrix.platform }}"
          tar -czf "artifact/release/iw4studio/${{ matrix.platform }}/${{ matrix.asset }}" -C publish .

      - name: Stage platform build
        uses: actions/upload-artifact@v4
        with:
          name: iw4studio-build-${{ github.run_attempt }}-${{ matrix.platform }}
          path: artifact
          if-no-files-found: error

  package:
    name: Release IW4Studio
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: iw4studio-build-${{ github.run_attempt }}-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_VERSION: ${{ needs.version.outputs.public_version }}
        run: |
          release_tag="iw4studio-v${PUBLIC_VERSION}"
          assets=(
            "release-assets/release/iw4studio/win_x64/iw4studio-win_x64.zip"
            "release-assets/release/iw4studio/macos_arm64/iw4studio-macos_arm64.tar.gz"
          )
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "IW4Studio ${PUBLIC_VERSION}" \
              --notes "Automated IW4Studio build from commit ${GITHUB_SHA}." \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "IW4Studio ${PUBLIC_VERSION}" \
              --notes "Automated IW4Studio build from commit ${GITHUB_SHA}." \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Merge platform builds
        uses: actions/upload-artifact/merge@v4
        with:
          name: iw4studio-${{ needs.version.outputs.public_version }}-attempt-${{ github.run_attempt }}
          pattern: iw4studio-build-${{ github.run_attempt }}-*
          delete-merged: true
