name: Build IW4Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Publish ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x64
            runner: windows-latest
            runtime: win-x64
          - platform: macos_x64
            runner: macos-15-intel
            runtime: osx-x64
          - platform: macos_arm64
            runner: macos-15
            runtime: osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish desktop app
        shell: bash
        run: >-
          dotnet publish src/IW4.Studio.Desktop/IW4.Studio.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output artifact/release/iw4studio/${{ matrix.platform }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Remove symbol files
        shell: bash
        run: find artifact -type f -iname '*.pdb' -delete

      - name: Stage platform build
        uses: actions/upload-artifact@v4
        with:
          name: iw4studio-build-${{ github.run_attempt }}-${{ matrix.platform }}
          path: artifact
          if-no-files-found: error

  package:
    name: Package IW4Studio
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Merge platform builds
        uses: actions/upload-artifact/merge@v4
        with:
          name: iw4studio-${{ github.run_number }}-${{ github.run_attempt }}
          pattern: iw4studio-build-${{ github.run_attempt }}-*
          delete-merged: true
