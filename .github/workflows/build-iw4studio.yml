name: Build IW4Studio

on:
  push:
    branches:
      - main
    paths:
      - apps/IW4Studio/**
      - src/**
      - Resources/**
      - tools/D3dbspLinker/**
      - tools/D3dbspLinker/**
      - tools/MapConverter/**
      - tools/MapConverter.IW3.PC/**
      - tools/MapConverter.IW3.PS3/**
      - global.json
      - .github/workflows/build-iw4studio.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    name: Resolve IW4Studio version
    runs-on: ubuntu-latest
    outputs:
      public_version: ${{ steps.version.outputs.public_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive build version
        id: version
        shell: bash
        run: |
          public_version="$(sed -n 's:^[[:space:]]*<VersionPrefix>\([^<]*\)</VersionPrefix>[[:space:]]*$:\1:p' apps/IW4Studio/IW4.Studio.Desktop.csproj)"
          if [[ ! "$public_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one major.minor.patch VersionPrefix in apps/IW4Studio/IW4.Studio.Desktop.csproj." >&2
            exit 1
          fi
          file_version="${public_version}.${GITHUB_RUN_NUMBER}"
          informational_version="${public_version}+build.${GITHUB_RUN_NUMBER}.attempt.${GITHUB_RUN_ATTEMPT}.sha.${GITHUB_SHA}"
          echo "public_version=$public_version" >> "$GITHUB_OUTPUT"
          echo "file_version=$file_version" >> "$GITHUB_OUTPUT"
          echo "informational_version=$informational_version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x64
            runner: windows-latest
            runtime: win-x64
            asset: iw4studio-win_x64.zip
          - platform: macos_arm64
            runner: macos-15
            runtime: osx-arm64
            asset: iw4studio-macos_arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Prepare bundled FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          distribution="$RUNNER_TEMP/iw4studio-ffmpeg"
          mkdir -p "$distribution"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="$distribution/ffmpeg.zip"
            curl -fsSL 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip' -o "$archive"
            echo '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba  '"$archive" | sha256sum -c -
            unzip -q "$archive" -d "$distribution"
            package="$distribution/ffmpeg-9.0.2-essentials_build"
            executable="$package/bin/ffmpeg.exe"
            license="$package/LICENSE"
            notice="$package/README.txt"
          else
            archive="$distribution/ffmpeg.zip"
            curl -fsSL 'https://ffmpeg.martin-riedl.de/download/macos/arm64/1795207104_9.1/ffmpeg.zip' -o "$archive"
            echo '1f66e9a690a7f1c9e60b012379f8869c11818d1797f45b21dbb2f2564ba61ae1  '"$archive" | shasum -a 256 -c -
            unzip -q "$archive" -d "$distribution"
            executable="$distribution/ffmpeg"
            chmod +x "$executable"
            license="$distribution/COPYING.GPLv3"
            curl -fsSL 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/n9.1/COPYING.GPLv3' -o "$license"
            echo '8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  '"$license" | shasum -a 256 -c -
            notice="$distribution/NOTICE.txt"
            printf '%s\n' \
              'FFmpeg 9.1 macOS arm64 distribution:' \
              'https://ffmpeg.martin-riedl.de/info/detail/macos/arm64/1795207104_9.1' \
              'FFmpeg source: https://github.com/FFmpeg/FFmpeg/tree/n9.1' > "$notice"
          fi
          echo "MAP_CONVERTER_FFMPEG_PATH=$executable" >> "$GITHUB_ENV"
          echo "MAP_CONVERTER_FFMPEG_LICENSE_PATH=$license" >> "$GITHUB_ENV"
          echo "MAP_CONVERTER_FFMPEG_NOTICE_PATH=$notice" >> "$GITHUB_ENV"

      - name: Publish desktop app
        shell: bash
        run: >-
          dotnet publish apps/IW4Studio/IW4.Studio.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output publish
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ needs.version.outputs.public_version }}
          -p:FileVersion=${{ needs.version.outputs.file_version }}
          -p:InformationalVersion=${{ needs.version.outputs.informational_version }}
          -p:PublishTrimmed=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:MapConverterFfmpegPath="$MAP_CONVERTER_FFMPEG_PATH"
          -p:MapConverterFfmpegLicensePath="$MAP_CONVERTER_FFMPEG_LICENSE_PATH"
          -p:MapConverterFfmpegNoticePath="$MAP_CONVERTER_FFMPEG_NOTICE_PATH"
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Remove symbol files
        shell: bash
        run: find publish -type f -iname '*.pdb' -delete

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = "artifact/release/iw4studio/${{ matrix.platform }}/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Compress-Archive -Path "publish/*" -DestinationPath $destination -CompressionLevel Optimal

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "artifact/release/iw4studio/${{ matrix.platform }}"
          tar -czf "artifact/release/iw4studio/${{ matrix.platform }}/${{ matrix.asset }}" -C publish .

      - name: Stage platform build
        uses: actions/upload-artifact@v4
        with:
          name: iw4studio-build-${{ github.run_attempt }}-${{ matrix.platform }}
          path: artifact
          if-no-files-found: error

  package:
    name: Release IW4Studio
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: iw4studio-build-${{ github.run_attempt }}-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_VERSION: ${{ needs.version.outputs.public_version }}
        run: |
          release_tag="iw4studio-v${PUBLIC_VERSION}-build.${GITHUB_RUN_NUMBER}"
          assets=(
            "release-assets/release/iw4studio/win_x64/iw4studio-win_x64.zip"
            "release-assets/release/iw4studio/macos_arm64/iw4studio-macos_arm64.tar.gz"
          )
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "IW4Studio ${PUBLIC_VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "Automated IW4Studio build from commit ${GITHUB_SHA}." \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "IW4Studio ${PUBLIC_VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "Automated IW4Studio build from commit ${GITHUB_SHA}." \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Merge platform builds
        uses: actions/upload-artifact/merge@v4
        with:
          name: iw4studio-${{ needs.version.outputs.public_version }}-attempt-${{ github.run_attempt }}
          pattern: iw4studio-build-${{ github.run_attempt }}-*
          delete-merged: true
